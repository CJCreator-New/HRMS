[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
base_url = http://localhost:3000
addopts = 
    --browser chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --html=test-report.html
    --self-contained-html
    --timeout=60
    -v
markers =
    smoke: P0 critical smoke tests
    auth: Authentication and session verification
    rbac: Role-based access control and route authorization matrix
    navigation: Sidebar, header, breadcrumbs, command palette
    forms: Form inputs, validations, date pickers, boundary limits
    buttons: Interactive buttons, punch button, state changes
    workflows: Complete end-to-end golden path journeys
    responsive: Mobile, tablet, desktop responsive viewports
    errors: 403, 404, error boundaries, network resilience
    accessibility: Automated axe-core WCAG 2.1 AA scans
    cross_browser: Multi-browser compatibility (chromium, firefox, webkit)
    redteam: Adversarial red-team, IDOR, state-machine, and business rule edge case tests
